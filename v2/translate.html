<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Gaku - Phrase Translation</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Apply dark mode immediately to prevent flash
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="translate">
  <div class="bg-pattern"></div>
  <div id="petals"></div>

  <div class="app-container">
    <div class="top-header">
      <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i> Back</button>
      <div class="header-title">Phrase Translation</div>
    </div>

    <div class="translate-container">
      <div class="translate-input-section">
        <h3><i class="fas fa-pen"></i> Enter text to translate</h3>
        <textarea class="translate-textarea" id="translateInput" placeholder="Type English or Japanese text here..." oninput="updateCharCount()"></textarea>
        <div class="translate-actions">
          <span class="char-count"><span id="charCount">0</span>/500</span>
          <button class="btn btn-primary" onclick="translateText()">
            <i class="fas fa-language"></i> Translate
          </button>
        </div>
      </div>
      <div class="translate-output">
        <h3><i class="fas fa-comment-dots"></i> Translation</h3>
        <div class="translation-result" id="translationResult">
          <p style="color: var(--text-secondary);">Your translation will appear here...</p>
        </div>
      </div>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-items">
      <a class="nav-item" href="home.html">
        <i class="fas fa-home"></i>

      </a>
      <a class="nav-item" href="vocabulary.html">
        <i class="fas fa-book"></i>

      </a>
      <a class="nav-item" href="courses.html">
        <i class="fas fa-torii-gate"></i>

      </a>
      <a class="nav-item" href="charts.html">
        <i class="fas fa-chart-line"></i>

      </a>
      <a class="nav-item" href="translate.html">
        <i class="fas fa-language"></i>

      </a>
      <a class="nav-item" href="playlist.html">
        <i class="fas fa-play-circle"></i>

      </a>
      <a class="nav-item" href="forum.html">
        <i class="fas fa-users"></i>

      </a>
    </div>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
