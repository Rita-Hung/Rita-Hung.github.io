<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Gaku v2 - Japanese Learning</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="launch">
  <div class="bg-pattern"></div>
  <div id="petals"></div>

  <div class="app-container">
    <div class="launch-screen">
      <div class="logo-container">
        <div class="logo">Sakura Gaku</div>
        <div class="logo-jp">桜学</div>
      </div>
      <p class="tagline">Begin your journey into Japanese language and culture</p>
      <div class="auth-buttons">
        <button class="btn btn-primary" onclick="showModal('loginModal')">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <button class="btn btn-secondary" onclick="showModal('signupModal')">
          <i class="fas fa-user-plus"></i> Sign Up
        </button>
      </div>
      <p style="margin-top: 24px; color: var(--text-secondary); font-size: 0.95rem;">
        Prefer to browse first? <a href="home.html" style="color: var(--sakura-dark); font-weight: 700; text-decoration: none;">Go to home</a>
      </p>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal" style="position: relative;">
      <button class="modal-close" onclick="hideModal('loginModal')">&times;</button>
      <div class="modal-header">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-secondary); margin-top: 5px;">Login to continue learning</p>
      </div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Login</button>
      </form>
    </div>
  </div>

  <!-- Signup Modal -->
  <div class="modal-overlay" id="signupModal">
    <div class="modal" style="position: relative;">
      <button class="modal-close" onclick="hideModal('signupModal')">&times;</button>
      <div class="modal-header">
        <h2>Welcome</h2>
        <p style="color: var(--text-secondary); margin-top: 5px;">Create an account to track progress</p>
      </div>
      <form onsubmit="handleSignup(event)">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="signupName" placeholder="Your name" required />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="signupEmail" placeholder="your@email.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign Up</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
