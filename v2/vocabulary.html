<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sakura Gaku - Vocabulary</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    // Apply dark mode immediately to prevent flash
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body data-page="vocabulary">
  <div class="bg-pattern"></div>
  <div id="petals"></div>

  <div class="app-container">
    <div class="top-header">
      <button class="back-btn" onclick="window.location.href='home.html'"><i class="fas fa-arrow-left"></i> Back</button>
      <div class="header-title">Vocabulary</div>
    </div>

    <div class="vocab-container">
      <div class="vocab-stats">
        <div class="vocab-stat">
          <div class="vocab-stat-num correct" id="correctCount">0</div>
          <div>Correct</div>
        </div>
        <div class="vocab-stat">
          <div class="vocab-stat-num wrong" id="wrongCount">0</div>
          <div>Wrong</div>
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="vocabProgress" style="width: 0%"></div>
      </div>

      <div class="flashcard-container">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
          <div class="card-face card-front">
            <div class="card-word" id="cardWord">日本語</div>
            <div class="card-reading" id="cardReading">にほんご</div>
            <p style="margin-top: 20px; color: var(--text-secondary); font-size: 0.9rem;">Tap to reveal meaning</p>
          </div>
          <div class="card-face card-back">
            <div class="card-meaning" id="cardMeaning">Japanese language</div>
            <div class="card-reading" id="cardExample">Example: 日本語を勉強しています</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="control-btn wrong" onclick="markCard(false)"><i class="fas fa-times"></i></button>
        <button class="control-btn next" onclick="nextCard()"><i class="fas fa-redo"></i></button>
        <button class="control-btn speak" onclick="speakJapanese()"><i class="fas fa-volume-up"></i></button>
        <button class="control-btn video" onclick="watchVideo()"><i class="fas fa-play"></i></button>
        <button class="control-btn correct" onclick="markCard(true)"><i class="fas fa-check"></i></button>
      </div>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-items">
      <a class="nav-item" href="home.html">
        <i class="fas fa-home"></i>

      </a>
      <a class="nav-item" href="vocabulary.html">
        <i class="fas fa-book"></i>

      </a>
      <a class="nav-item" href="courses.html">
        <i class="fas fa-torii-gate"></i>

      </a>
      <a class="nav-item" href="charts.html">
        <i class="fas fa-chart-line"></i>

      </a>
      <a class="nav-item" href="translate.html">
        <i class="fas fa-language"></i>

      </a>
      <a class="nav-item" href="playlist.html">
        <i class="fas fa-play-circle"></i>

      </a>
      <a class="nav-item" href="forum.html">
        <i class="fas fa-users"></i>

      </a>
    </div>
  </nav>

  <script src="js/app.js"></script>
</body>
</html>
